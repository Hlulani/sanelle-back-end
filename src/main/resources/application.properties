spring.application.name=sanelle
# Hosting platforms choose the port through PORT.
server.port=${PORT:8080}

# Database Configuration
# DB_URL wins when set; hosts that give the parts separately (e.g. Render) set DB_HOST, DB_PORT and DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sanelle}}
spring.datasource.username=${DB_USERNAME:sanelle}
spring.datasource.password=${DB_PASSWORD:sanelle}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway (explicit)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

springdoc.swagger-ui.customCssUrl=/swagger-ui/custom.css


# JWT (dev)
app.jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_123456}
app.jwt.access-minutes=60
app.jwt.refresh-days=30

# Accounts: links in emails open the front end here
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
# Development only: keep sent emails in memory and serve them at /api/v1/dev/outbox. Never in production.
app.mail.outbox.enabled=${MAIL_OUTBOX_ENABLED:false}
# Comma-separated emails that get the EVIDENCE_EDITOR role
app.evidence.editors=${APP_EVIDENCE_EDITORS:}

# AI drafting from her check-ins (off unless a key is set). The key stays on the server.
app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}



# Max file size for a single file
spring.servlet.multipart.max-file-size=10MB
# Max request size (file + JSON data combined)
spring.servlet.multipart.max-request-size=10MB

# CORS (comma-separated). Defaults include the local phone preview and its browser-test server.
# A deployed CORS_ALLOWED_ORIGINS value replaces this entire development list.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200,http://127.0.0.1:4200,http://localhost:4300,http://127.0.0.1:4300,http://localhost:4301,http://127.0.0.1:4301,capacitor://localhost,http://localhost}
