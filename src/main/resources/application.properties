spring.application.name=sanelle

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sanelle}
spring.datasource.username=${DB_USERNAME:sanelle}
spring.datasource.password=${DB_PASSWORD:sanelle}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway (explicit)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

springdoc.swagger-ui.customCssUrl=/swagger-ui/custom.css


# JWT (dev)
app.jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_123456}
app.jwt.access-minutes=60
app.jwt.refresh-days=30


# Cookie settings (web)
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
app.jwt.refresh-cookie-samesite=Lax

# Max file size for a single file
spring.servlet.multipart.max-file-size=10MB
# Max request size (file + JSON data combined)
spring.servlet.multipart.max-request-size=10MB

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200,capacitor://localhost,http://localhost}
